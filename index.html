<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006440">
  <title>Dashboard Profarma — CD RJ</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <img src="assets/profarma-logo.png" alt="Profarma" onerror="this.hidden=true">
      <span class="brand-title">PAINEL DE OPERAÇÃO</span>
    </div>
    <div id="info" aria-live="polite">Carregue uma planilha para começar.</div>
    <button id="settingsButton" class="gear" type="button" aria-label="Organizar planilhas" title="Organizar planilhas">⚙</button>
  </header>
  <main id="app">
    <div id="viewport" aria-label="Painel do relatório"><div id="canvas"></div></div>
  </main>
  <input id="fileInput" type="file" multiple accept=".xlsx,.xls,.csv,.txt" hidden>
  <div id="dropOverlay" aria-hidden="true">Solte as planilhas aqui</div>
  <nav id="tabs" aria-label="Páginas do dashboard"></nav>
  <div id="modalRoot"></div>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
